# =============================================================================
# Aegis Platform — 本地启动脚本配置
# -----------------------------------------------------------------------------
# 优先级：脚本硬编码默认值  <  本机环境变量  <  本文件显式设置
#
# 留空或注释掉 = 使用脚本默认值 / 本机 PATH 自动发现
# 取消注释并赋值 = 强制使用该值（覆盖环境变量和 PATH）
# =============================================================================

# ---- JDK 21+ ----
# Windows:
# JAVA_HOME="D:\Program Files\Java\jdk-21"
# macOS:
# JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
# Linux:
# JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64

# ---- Maven 3.9+ ----
# Windows:
# MVN_CMD="D:\tools\apache-maven-3.9.9\bin\mvn.cmd"
# macOS / Linux:
# MVN_CMD=/usr/local/bin/mvn

# ---- Sandbox Docker 连接 ----
# Windows Docker Desktop（4 slashes 是 docker-java 解析 npipe 协议的硬性要求）:
# SANDBOX_DOCKER_HOST=npipe:////./pipe/docker_engine
# macOS Docker Desktop / Linux Docker Engine:
# SANDBOX_DOCKER_HOST=unix:///var/run/docker.sock
# 远程 Docker（独立服务器 / macOS colima port-forward）:
# SANDBOX_DOCKER_HOST=tcp://127.0.0.1:2375
