# Aegis Platform Web - Nginx 配置
# 职责：托管前端静态资源 + 反向代理 API/SSE 到网关(aegis-gateway:8080)
# 网关内部已配路由: /api/admin/**|/api/resource/** -> aegis-admin, /api/runtime/** -> aegis-runtime

server {
    listen       80;
    server_name  _;

    # Docker 内置 DNS，用于运行时解析 aegis-gateway 主机名（避免网关未就绪时 nginx 启动失败）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 字符集
    charset utf-8;

    # 静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩（API/SSE 不压缩，仅静态资源）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json text/xml;
    gzip_vary on;

    # 单页应用路由：history 模式 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（hash 文件名，长期缓存）
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存（保证发布即时生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- 反向代理：/api -> aegis-gateway:8080 ----
    # 用变量 + resolver 运行时解析，网关未就绪时 nginx 不崩溃
    location /api/ {
        set $upstream_api http://aegis-gateway:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关闭缓冲、保持长连接、禁用超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- 反向代理：/sse -> aegis-gateway:8080 ----
    location /sse/ {
        set $upstream_sse http://aegis-gateway:8080;
        proxy_pass $upstream_sse;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
