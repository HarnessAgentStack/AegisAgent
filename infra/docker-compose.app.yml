# =============================================================================
# Aegis Platform - 应用服务 Compose (gateway / admin / runtime / web)
# -----------------------------------------------------------------------------
# 前置：基础设施须先启动
#   docker compose up                                     # 起基础设施
#   docker compose -f docker-compose.app.yml up -d --build  # 起应用（前提：基础设施已起）
# 或全栈一次起：
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# 网络：两个 compose 文件同目录 = 同 project = 共享默认网络，
#       应用容器可直接以 mysql / redis / nacos / minio / milvus 主机名互访。
#
# 启动顺序：跨文件无法声明 depends_on，应用依赖 restart: unless-stopped
#           自愈等待基础设施就绪（MySQL 健康前可能重启数次，属正常）。
#
# profile：默认 gateway + admin + runtime + web 四件
#          --profile mcp-demo  额外起示例 MCP 服务（8084）
#
# 配置：环境变量来自同目录 .env（复制 .env.example）
# 数据库：依赖 01_schema_init.sql + 02_seed_data.sql 已由 MySQL 容器首启初始化
# =============================================================================

services:
  # ============================================================================
  # 网关（WebFlux + 路由 + 鉴权 + SSE 粘性路由）: 8080
  # ============================================================================
  aegis-gateway:
    build:
      context: ../aegis-platform-backend
      dockerfile: aegis-gateway/Dockerfile
    image: aegis-gateway:latest
    container_name: aegis-gateway
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-aegis}
      - DB_PASSWORD=${DB_PASSWORD:-aegis123}
      - DB_NAME=${DB_NAME:-aegis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-aegis}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-aegis12345}
      # Nacos 注册/配置中心地址（application.yml 默认 127.0.0.1，容器内须指向 nacos）
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVERADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVERADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"

  # ============================================================================
  # 管理后台（租户/用户/角色/审计/沙箱治理/模型配置）: 8082
  # ============================================================================
  aegis-admin:
    build:
      context: ../aegis-platform-backend
      dockerfile: aegis-admin/Dockerfile
    image: aegis-admin:latest
    container_name: aegis-admin
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-aegis}
      - DB_PASSWORD=${DB_PASSWORD:-aegis123}
      - DB_NAME=${DB_NAME:-aegis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-aegis}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-aegis12345}
      # Nacos 注册中心地址
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVERADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      # admin -> runtime 内部调用（模板缓存失效通知，默认 localhost 须覆盖）
      - AEGIS_RUNTIME_BASE_URL=http://aegis-runtime:8081
      - AEGIS_RUNTIME_BASEURL=http://aegis-runtime:8081
      - TZ=Asia/Shanghai
    ports:
      - "8082:8082"

  # ============================================================================
  # 运行时（AgentScope 2.0.2 对话核心 + 沙箱执行）: 8081
  # ============================================================================
  aegis-runtime:
    build:
      context: ../aegis-platform-backend
      dockerfile: aegis-runtime/Dockerfile
    image: aegis-runtime:latest
    container_name: aegis-runtime
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-aegis}
      - DB_PASSWORD=${DB_PASSWORD:-aegis123}
      - DB_NAME=${DB_NAME:-aegis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-aegis}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-aegis12345}
      - UPON_REDIS_HOST=redis
      - UPON_REDIS_PORT=6379
      - UPON_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Nacos 注册中心地址
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVERADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      # Milvus 向量库（application.yml 硬编码 localhost，容器内须指向 milvus）
      - AEGIS_MILVUS_HOST=milvus
      - AEGIS_MILVUS_PORT=19530
      # PaddleOCR（默认 localhost:8098，容器内须指向 OCR 服务；未启用 ocr profile 时失败可容忍）
      - AEGIS_OCR_PADDLE_ENDPOINT=${AEGIS_OCR_PADDLE_ENDPOINT:-http://aegis-paddleocr:8000}
      # 沙箱模式：local profile -> backend=docker（application-local.yml 覆盖）
      # 切 K8s 生产模式设 SPRING_PROFILES_ACTIVE 为空
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - SANDBOX_DOCKER_HOST=${SANDBOX_DOCKER_HOST:-unix:///var/run/docker.sock}
      - TZ=Asia/Shanghai
    ports:
      - "8081:8081"
    # 沙箱 backend=docker 时需挂载宿主 docker.sock（Linux/Mac；
    # Windows Docker Desktop 需改为 npipe 挂载或改用 K8s 模式）
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - aegis-user-files:/workspace/user_files

  # ============================================================================
  # 前端（React + nginx 反代到 gateway）: 80
  # ============================================================================
  aegis-web:
    build:
      context: ../aegis-platform-web
      dockerfile: Dockerfile
    image: aegis-web:latest
    container_name: aegis-web
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
    depends_on:
      - aegis-gateway

  # ============================================================================
  # profile: mcp-demo - 示例 MCP 服务（aegis-mcp-demo）: 8084
  # ============================================================================
  aegis-mcp-demo:
    profiles: ["mcp-demo"]
    build:
      context: ../aegis-platform-backend
      dockerfile: aegis-mcp-demo/Dockerfile
    image: aegis-mcp-demo:latest
    container_name: aegis-mcp-demo
    restart: unless-stopped
    environment:
      - AEGIS_ADMIN_URL=http://aegis-admin:8082
      - AEGIS_MCP_DEMO_ENDPOINT=http://aegis-mcp-demo:8084/sse
      - TZ=Asia/Shanghai
    ports:
      - "8084:8084"
    depends_on:
      - aegis-admin

volumes:
  aegis-user-files:
