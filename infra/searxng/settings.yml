# SearXNG Settings for Aegis Platform
# ===================================
# 核心配置：启用 JSON 格式输出、聚合多搜索引擎、关闭 tracker 保护隐私
# 完整配置参考：https://docs.searxng.org/dev/settings.html

server:
  secret_key: "${SEARXNG_SECRET}"
  base_url: "${SEARXNG_BASE_URL}"
  bind_address: "0.0.0.0"
  port: 8080
  public_instance: false

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "zh-CN"
  languages:
    - "zh-CN"
    - "zh-TW"
    - "en"
    - ""
  max_balancer_span: 86400
  timeout_limit: 5.0

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 50
  enable_http2: true

# 启用 JSON 格式输出（Aegis Java 客户端用 ?format=json 获取结构化结果）
formats:
  - html
  - json
  - csv
  - rss

# 搜索引擎配置：聚合多引擎，任一被封不影响其他
engines:
  - name: google
    engine: google
    shortcut: g
    timeout: 4.0
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    timeout: 4.0
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    timeout: 4.0
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    timeout: 4.0
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    timeout: 3.0
    disabled: false

# 隐私保护：关闭 tracker、加密 session
server.public_instance: false

# Redis 限流（可选，单机部署可忽略）
limiter: false
