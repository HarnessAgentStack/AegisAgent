# Aegis CI 流水线
# PR 触发：Maven 编译 + 单元测试 + 前端构建 + e2e smoke
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # ---- 后端编译 + 单元测试 ----
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Maven compile + test
        run: |
          cd aegis-platform-backend
          mvn clean test -B -ntp --fail-at-end

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: aegis-platform-backend/**/target/surefire-reports/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: aegis-platform-backend/**/target/site/jacoco/

  # ---- 前端构建 + Lint ----
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-platform-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: aegis-platform-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: aegis-platform-web/dist/

  # ---- 后端 Docker 镜像构建验证 ----
  docker:
    name: Docker Build (Gateway + Runtime + Admin)
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        service: [gateway, runtime, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: aegis-platform-backend
          file: aegis-platform-backend/aegis-${{ matrix.service }}/Dockerfile
          tags: aegis-${{ matrix.service }}:test
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
